    <meta charset="UTF-8" />
    <style>
      #root:empty { min-height: 100dvh; }
      .boot-splash {
        position: fixed; inset: 0; display: flex; min-height: 100dvh;
        flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
        background: radial-gradient(ellipse at 50% 44%, rgba(99,102,241,.12), transparent 38%), #0B0D12;
        color: #A1A8B8; font: 500 0.75rem Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .025em;
      }
      .boot-splash-mark {
        display: grid; width: 5.5rem; height: 5.5rem; place-items: center;
        border: 1px solid rgba(129,140,248,.2); border-radius: 1.65rem;
        background: rgba(22,26,35,.72); box-shadow: 0 0 0 8px rgba(129,140,248,.035), 0 16px 56px rgba(0,0,0,.32);
        animation: boot-splash-breathe 2.2s ease-in-out infinite;
      }
      .boot-splash-mark img { width: 3.5rem; height: 3.5rem; object-fit: contain; filter: drop-shadow(0 0 18px rgba(129,140,248,.28)); }
      .boot-splash-dots { display: flex; gap: .35rem; }
      .boot-splash-dots i { width: .3rem; height: .3rem; border-radius: 9999px; background: #818CF8; animation: boot-splash-dot 1.1s ease-in-out infinite; }
      .boot-splash-dots i:nth-child(2) { animation-delay: 140ms; }
      .boot-splash-dots i:nth-child(3) { animation-delay: 280ms; }
      @keyframes boot-splash-breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes boot-splash-dot { 0%,60%,100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash-mark, .boot-splash-dots i { animation: none; } }
    </style>
