name: Temporary TypeScript Diagnostics

on:
  push:
    branches:
      - fix/typecheck-diagnostics-2026-11-17

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
