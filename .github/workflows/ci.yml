name: CI
on: [push, pull_request]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run tests
        env:
          NODE_ENV: test
          ADMIN_API_KEY: ci-test-admin-key-0123456789abcdef
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DATABASE_PATH: ":memory:"
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || vars.DISCORD_BOT_TOKEN || 'ci-test-bot-token' }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY || vars.DISCORD_PUBLIC_KEY }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID || vars.DISCORD_APPLICATION_ID }}
        run: npm test

      - name: Run server performance benchmarks
        env:
          NODE_ENV: test
          ADMIN_API_KEY: ci-test-admin-key-0123456789abcdef
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DATABASE_PATH: ":memory:"
          DISCORD_BOT_TOKEN: ci-test-bot-token
        run: npm run benchmark:json | tee /dev/stderr | sed -n '/^{/,$p' > server-performance-report.json
        shell: bash

      - name: Validate benchmark report JSON
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; JSON.parse(readFileSync('server-performance-report.json', 'utf8'));"

      - name: Upload server performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-performance-report-node-${{ matrix.node-version }}
          path: server-performance-report.json
          if-no-files-found: ignore
