name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan repository history for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            git /repo --gitleaks-ignore-path /repo/.gitleaksignore --redact --report-format json --report-path /repo/gitleaks-report.json --exit-code 1

      - name: Upload redacted secret scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    name: Static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Scan TypeScript and Node.js code
        run: semgrep scan --config p/security-audit --config p/typescript --config p/nodejs --error --exclude node_modules --exclude dist

  dependency-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check for high and critical npm vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high --json > npm-audit-report.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("npm-audit-report.json", "utf8"));
          console.log("Dependency vulnerability summary:");
          console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          NODE

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-security-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
