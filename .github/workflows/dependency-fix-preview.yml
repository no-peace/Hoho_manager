name: Dependency Fix Preview

on:
  push:
    branches: [chore/security-final]

permissions:
  contents: write
  actions: write

jobs:
  preview:
    name: Apply compatible npm security fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Apply non-breaking security updates
        run: npm audit fix --package-lock-only

      - name: Verify updated lockfile
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes are required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update vulnerable npm dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trigger full validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run security.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run lighthouse.yml --ref "${GITHUB_REF_NAME}"
