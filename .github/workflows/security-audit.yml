name: Security Audit

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-report.json
          audit_status=$?
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("npm-audit-report.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("Production dependency vulnerability summary:");
          console.log(JSON.stringify(counts, null, 2));
          NODE
          exit "$audit_status"

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
